{{- range $svc := list "serviceRegistry" "configServer" "apiGateway" "userService" "coreBankingService" "fundTransferService" "utilityPaymentService" }}
{{- $config := index $.Values $svc }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    version: {{ $.Chart.AppVersion }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $config.name }}
  strategy:
    type: {{ $.Values.strategy.type }}
    rollingUpdate:
      maxSurge: {{ $.Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $.Values.strategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        app: {{ $config.name }}
        version: {{ $.Chart.AppVersion }}
    spec:
      containers:
        - name: {{ $config.name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}

          ports:
            - containerPort: 8092   # ✅ force correct port

          # ✅ FIX: Disable DB auto-config (prevents crash)
          env:
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

          {{- if $config.resources }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- end }}

          {{- if and $config.healthCheck $config.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: {{ $config.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ $config.healthCheck.periodSeconds }}
            failureThreshold: {{ $config.healthCheck.failureThreshold }}

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: {{ $config.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ $config.healthCheck.periodSeconds }}
            failureThreshold: {{ $config.healthCheck.failureThreshold }}
          {{- end }}

{{- end }}
{{- end }}
