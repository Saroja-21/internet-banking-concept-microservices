# Deploy ONLY fund-transfer-service
global:
  namespace: internet-banking

serviceRegistry:
  enabled: false

configServer:
  enabled: false

apiGateway:
  enabled: false

userService:
  enabled: false

coreBankingService:
  enabled: false

fundTransferService:
  enabled: true
  name: fund-transfer-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-fund-transfer-service
    tag: "70"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 10

utilityPaymentService:
  enabled: false

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
