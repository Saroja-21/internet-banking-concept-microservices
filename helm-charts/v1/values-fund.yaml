# Deploy ONLY fund-transfer-service
global:
  namespace: internet-banking

serviceRegistry:
  enabled: false

configServer:
  enabled: false

apiGateway:
  enabled: false

userService:
  enabled: false

coreBankingService:
  enabled: false

fundTransferService:
  enabled: true
  name: fund-transfer-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-fund-transfer-service
    tag: "main"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "300m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 120
    periodSeconds: 15
    failureThreshold: 12

utilityPaymentService:
  enabled: false

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
