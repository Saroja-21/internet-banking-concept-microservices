global:
  namespace: internet-banking

serviceRegistry:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: service-registry
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-service-registry
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8761

configServer:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: config-server
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-config-server
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888

apiGateway:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: api-gateway
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-api-gateway
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080

userService:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: user-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-user-service
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081

coreBankingService:
  enabled: true
  name: core-banking-service
  replicaCount: 2
  image:
    repository: saroja21/core-banking-service
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082

fundTransferService:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: fund-transfer-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-fund-transfer-service
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083

utilityPaymentService:
  enabled: "<+pipeline.variables.deployCoreOnly> == false"
  name: utility-payment-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-utility-payment-service
    tag: "main"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
