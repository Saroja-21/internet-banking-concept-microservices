# Working version (v1) - Proper configurations
global:
  namespace: internet-banking

serviceRegistry:
  enabled: true
  name: service-registry
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-service-registry
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8761
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

configServer:
  enabled: true
  name: config-server
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-config-server
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 45
    periodSeconds: 10
    failureThreshold: 3

apiGateway:
  enabled: true
  name: api-gateway
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-api-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

userService:
  enabled: true
  name: user-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-user-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

coreBankingService:
  enabled: true
  name: core-banking-service
  replicaCount: 2
  image:
    repository: saroja21/core-banking-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

fundTransferService:
  enabled: true
  name: fund-transfer-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-fund-transfer-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

utilityPaymentService:
  enabled: true
  name: utility-payment-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-utility-payment-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
