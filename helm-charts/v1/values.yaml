global:
  namespace: internet-banking

serviceRegistry:
  enabled: false
  name: service-registry
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-service-registry
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8761

configServer:
  enabled: false
  name: config-server
  replicaCount: 1
  image:
    repository: saroja21/internet-banking-config-server
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888

apiGateway:
  enabled: false
  name: api-gateway
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-api-gateway
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080

userService:
  enabled: false
  name: user-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-user-service
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081

coreBankingService:
  enabled: true
  name: core-banking-service
  replicaCount: 2
  image:
    repository: saroja21/core-banking-service
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8092
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  healthCheck:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6

fundTransferService:
  enabled: false
  name: fund-transfer-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-fund-transfer-service
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083

utilityPaymentService:
  enabled: false
  name: utility-payment-service
  replicaCount: 2
  image:
    repository: saroja21/internet-banking-utility-payment-service
    tag: "b7ff565610c4f67ed925e09e5516ad5a721b72fc"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
