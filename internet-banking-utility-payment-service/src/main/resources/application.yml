spring:
  application:
    name: internet-banking-utility-payment-service
  cloud:
    config:
      enabled: false
      fail-fast: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  port: 8084

